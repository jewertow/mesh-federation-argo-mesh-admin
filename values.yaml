global:
  defaultServicePorts:
  - number: 9080
    name: http
    protocol: HTTP
  enableGatewayAPI: true
  enableOpenshiftRouter: true
  gateways:
    egress:
      enabled: true
      port: 443
  remote:
  - mesh: east-mesh
    addresses:
    - console-openshift-console.apps.east.servicemesh.devcluster.openshift.com
    port: 443
    network: east-network
    importedServices:
    - ratings.mesh.global
  - mesh: west-mesh
    addresses:
    - console-openshift-console.apps.west.servicemesh.devcluster.openshift.com
    port: 443
    network: west-network
    importedServices:
    - details.mesh.global
    - ratings.mesh.global
